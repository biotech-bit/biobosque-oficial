<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioBosque - IFPA Itaituba</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --verde-if: #32a041; --verde-escuro: #1b5e20; --dourado: #ffb300; --bg: #f4f7f1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); padding-bottom: 90px; }

        /* --- PÁGINA INICIAL (HERO) --- */index.html        .header-logos {
            position: absolute; top: 20px; width: 100%; display: flex; 
            justify-content: space-between; padding: 0 25px; z-index: 10;
        }
        .logo-circle { width: 80px; height: 80px; border-radius: 50%; border: 3px solid white; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.3); background: white; }
        
        .hero {
            height: 100vh; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('fundo.jpeg.jpeg');
            background-size: cover; background-position: center; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; color: white; padding: 20px;
        }
        .img-fachada { width: 250px; height: 160px; object-fit: cover; border-radius: 15px; border: 4px solid var(--dourado); margin-bottom: 20px; }
        .hero h1 { font-size: 1.3rem; max-width: 900px; text-transform: uppercase; line-height: 1.4; }

        /* --- NAVEGAÇÃO --- */
        nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 12px 0; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); z-index: 100; }
        .nav-btn { border: none; background: none; color: #888; font-size: 0.75rem; cursor: pointer; }
        .nav-btn.active { color: var(--verde-if); font-weight: bold; }

        /* --- SEÇÕES --- */
        section { display: none; padding: 25px; animation: fadeIn 0.4s ease; }
        .active-section { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        /* --- FORMULÁRIO --- */
        label { font-weight: 600; color: var(--verde-escuro); font-size: 0.9rem; display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; }
        .btn-principal { background: var(--verde-if); color: white; border: none; width: 100%; padding: 15px; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        /* --- INVENTÁRIO (A PASTA DE DADOS) --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .tree-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .tree-card img { width: 100%; height: 220px; object-fit: cover; }
        .info { padding: 20px; }
        .info h3 { color: var(--verde-escuro); text-transform: uppercase; margin-bottom: 5px; }
        
        /* CORREÇÃO DO QR CODE: Evita que apareça canvas + img duplicados */
        .qr-container { background: #f9f9f9; padding: 15px; text-align: center; border-radius: 15px; margin-top: 15px; border: 1px dashed #ccc; display: flex; justify-content: center; align-items: center; }
        .qr-container img { display: none; } /* Oculta a tag img sobressalente gerada pelo qrcodejs */
        .qr-container canvas { display: block !important; margin: 0 auto; width: 120px !important; height: 120px !important; }

        .btn-map-link { background: #1976d2; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; margin-top: 15px; cursor: pointer; font-weight: bold; }

        /* ESTILO PARA IMPRESSÃO */
        @media print {
            nav, .btn-principal, .btn-map-link, header, .header-logos { display: none !important; }
            body { padding: 0; background: white; }
            section { display: block !important; }
            .tree-card { break-inside: avoid; page-break-inside: avoid; border: 1px solid #ccc; box-shadow: none; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <!-- 1. INÍCIO -->
    <section id="inicio" class="active-section">
        <div class="header-logos">
            <img src="biologia.jfif.jfif" class="logo-circle">
            <img src="ifpa.jfif.jfif" class="logo-circle">
        </div>
        <div class="hero">
            <img src="fundo.jpeg.jpeg" class="img-fachada">
            <h1>UTILIZAÇÃO DE QR CODE COMO FERRAMENTA DE GESTÃO NA IDENTIFICAÇÃO DE ESPÉCIES ARBÓREAS DO CAMPUS DO IFPA - ITAITUBA</h1>
            <p style="margin-top: 15px;">Desenvolvido por Rose Magno de Sousa</p>
        </div>
    </section>

    <!-- 2. CADASTRO -->
    <section id="cadastro">
        <h2>🌱 Registrar Árvore</h2>
        <div class="card">
            <label>Nome da Árvore</label>
            <input type="text" id="nome" placeholder="Nome Popular e Científico">
            
            <label>Coordenadas (Lat, Long)</label>
            <input type="text" id="coords" placeholder="Ex: -4.2742, -55.9871">

            <label>Descrição</label>
            <textarea id="descricao" rows="3" placeholder="Detalhes da planta..."></textarea>

            <label>Puxar Foto do Computador</label>
            <input type="file" id="arquivo" accept="image/*">

            <button class="btn-principal" onclick="salvarArvore()">SALVAR E GERAR QR CODE</button>
        </div>
    </section>

    <!-- 3. PASTA DE DADOS (INVENTÁRIO) -->
    <section id="catalogo">
        <h2>📖 Pasta de Identificação</h2>
        <div id="lista-plantas" class="grid"></div>
    </section>

    <!-- 4. MAPA SATÉLITE -->
    <section id="mapa">
        <h2>📍 Localização Satélite Real</h2>
        <div class="card" style="height: 500px; padding: 0; overflow: hidden;">
            <iframe id="google-maps" src="" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
        </div>
    </section>

    <nav>
        <button class="nav-btn active" onclick="irAba('inicio')">🏠<br>Início</button>
        <button class="nav-btn" onclick="irAba('cadastro')">➕<br>Cadastrar</button>
        <button class="nav-btn" onclick="irAba('catalogo')">📖<br>Pasta</button>
        <button class="nav-btn" onclick="irAba('mapa')">📍<br>Mapa</button>
    </nav>

    <script>
        let inventario = JSON.parse(localStorage.getItem('tcc_final_rose')) || [];

        function irAba(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active-section'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active-section');
            if(id === 'catalogo') atualizarPasta();
            
            const botoes = ['inicio', 'cadastro', 'catalogo', 'mapa'];
            document.querySelectorAll('.nav-btn')[botoes.indexOf(id)].classList.add('active');
        }

        function salvarArvore() {
            const file = document.getElementById('arquivo').files[0];
            const reader = new FileReader();

            const nova = {
                id: Date.now(),
                nome: document.getElementById('nome').value,
                coords: document.getElementById('coords').value,
                desc: document.getElementById('descricao').value
            };

            reader.onloadend = function() {
                nova.midia = reader.result || 'fundo.jpeg.jpeg';
                inventario.push(nova);
                localStorage.setItem('tcc_final_rose', JSON.stringify(inventario));
                alert("Salvo com sucesso!");
                irAba('catalogo');
            }

            if(file) reader.readAsDataURL(file);
            else reader.onloadend();
        }

        function atualizarPasta() {
            const container = document.getElementById('lista-plantas');
            container.innerHTML = "";
            
            inventario.forEach(p => {
                const card = document.createElement('div');
                card.className = 'tree-card';
                card.innerHTML = `
                    <img src="${p.midia}">
                    <div class="info">
                        <h3>${p.nome}</h3>
                        <p>${p.desc}</p>
                        <p style="font-weight:bold; margin-top:10px;">📍 ${p.coords}</p>
                        <div class="qr-container" id="qr-${p.id}"></div>
                        <button class="btn-map-link" onclick="abrirNoMapa('${p.coords}')">VER NO SATÉLITE</button>
                    </div>
                `;
                container.appendChild(card);
                
                // Limpa o conteúdo da caixa antes de gerar para não duplicar
                const qrElement = document.getElementById(`qr-${p.id}`);
                qrElement.innerHTML = "";
                
                new QRCode(qrElement, {
                    text: `ÁRVORE: ${p.nome}\nCOORD: ${p.coords}`,
                    width: 120, 
                    height: 120
                });
            });
        }

        function abrirNoMapa(coords) {
            const frame = document.getElementById('google-maps');
            frame.src = `https://maps.google.com/maps?q=${coords}&t=k&z=19&output=embed`;
            irAba('mapa');
        }

        window.onload = atualizarPasta;
    </script>
</body>
</html>
