<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identificação Botânica</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f7f4; color: #2e4036; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
    .galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 15px 0; }
    .galeria img, .galeria video { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; }
    .mapa-box { background: #e0ece4; padding: 12px; border-radius: 8px; margin-top: 15px; font-weight: bold; }
    .btn-gps { display: inline-block; margin-top: 8px; background: #2e7d32; color: white; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-size: 0.9em; }
  </style>
</head>
<body>

<div class="card">
  <h1 id="nome-arvore">Carregando...</h1>
  <p><em><span id="nome-cientifico"></span></em></p>
  
  <h3>Galeria do Sistema (Fotos e Vídeos)</h3>
  <div id="galeria-midia" class="galeria"></div>

  <h3>Descrição Botânica</h3>
  <p id="descricao-arvore"></p>

  <div class="mapa-box">
    <span>📍 Localização Exata:</span>
    <p id="coordenadas">Latitude: -- | Longitude: --</p>
    <a id="link-mapa" href="#" target="_blank" class="btn-gps">Abrir no Google Maps</a>
  </div>
</div>

<script>
  // Exemplo de recuperação de dados pela URL (?id=123)
  const urlParams = new URLSearchParams(window.location.search);
  const arvoreId = urlParams.get('id') || '1';

  // Exemplo de estrutura de dados da árvore cadastrada
  const dadosArvore = {
    id: "1",
    nomePopular: "Ipê-Amarelo",
    nomeCientifico: "Handroanthus albus",
    descricao: "Árvore caducifólia de porte médio a grande, muito utilizada no paisagismo urbano. Apresenta floração amarela intensa no período da seca.",
    lat: -4.2691,
    lng: -55.9862,
    midias: [
      { tipo: 'imagem', url: 'https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=400' },
      { tipo: 'imagem', url: 'https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=400' }
    ]
  };

  // Renderização dinâmica na página
  document.getElementById('nome-arvore').innerText = dadosArvore.nomePopular;
  document.getElementById('nome-cientifico').innerText = dadosArvore.nomeCientifico;
  document.getElementById('descricao-arvore').innerText = dadosArvore.descricao;
  document.getElementById('coordenadas').innerText = `Lat: ${dadosArvore.lat} | Lng: ${dadosArvore.lng}`;
  document.getElementById('link-mapa').href = `https://www.google.com/maps?q=${dadosArvore.lat},${dadosArvore.lng}`;

  const galeriaContainer = document.getElementById('galeria-midia');
  dadosArvore.midias.forEach(item => {
    if(item.tipo === 'imagem') {
      const img = document.createElement('img');
      img.src = item.url;
      galeriaContainer.appendChild(img);
    } else if(item.tipo === 'video') {
      const video = document.createElement('video');
      video.src = item.url;
      video.controls = true;
      galeriaContainer.appendChild(video);
    }
  });
</script>

</body>
</html>
