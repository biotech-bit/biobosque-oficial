<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioBosque - IFPA Itaituba</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --verde-if: #32a041; --verde-escuro: #1b5e20; --dourado: #ffb300; --bg: #f4f7f1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); padding-bottom: 90px; }

        /* --- PÁGINA INICIAL --- */
        .header-logos {
            position: absolute; top: 20px; width: 100%; display: flex; 
            justify-content: space-between; padding: 0 25px; z-index: 10;
        }
        .logo-circle { width: 80px; height: 80px; border-radius: 50%; border: 3px solid white; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.3); background: white; }
        
        .hero {
            height: 100vh; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('fundo.jpeg.jpeg');
            background-size: cover; background-position: center; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; color: white; padding: 20px;
        }
        .img-fachada { width: 250px; height: 160px; object-fit: cover; border-radius: 15px; border: 4px solid var(--dourado); margin-bottom: 20px; }
        .hero h1 { font-size: 1.3rem; max-width: 900px; text-transform: uppercase; line-height: 1.4; }

        /* --- NAVEGAÇÃO --- */
        nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 12px 0; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); z-index: 100; }
        .nav-btn { border: none; background: none; color: #888; font-size: 0.75rem; cursor: pointer; }
        .nav-btn.active { color: var(--verde-if); font-weight: bold; }

        /* --- SEÇÕES --- */
        section { display: none; padding: 25px; animation: fadeIn 0.4s ease; }
        .active-section { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        /* --- FORMULÁRIO --- */
        label { font-weight: 600; color: var(--verde-escuro); font-size: 0.9rem; display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; }
        .btn-principal { background: var(--verde-if); color: white; border: none; width: 100%; padding: 15px; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        /* --- INVENTÁRIO (A PASTA DE DADOS) --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .tree-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .tree-card img { width: 100%; height: 200px; object-fit: cover; }
        .info { padding: 20px; }
        .info h3 { color: var(--verde-escuro); text-transform: uppercase; margin-bottom: 2px; }
        .info p.cientifico { font-style: italic; color: #555; margin-bottom: 8px; font-weight: 600; }
        .info p.familia { font-size: 0.85rem; color: #777; margin-bottom: 10px; }
        .info p.desc { font-size: 0.9rem; line-height: 1.4; color: #333; margin-bottom: 10px; }
        
        /* CORREÇÃO QR CODE */
        .qr-container { background: #f9f9f9; padding: 15px; text-align: center; border-radius: 15px; margin-top: 15px; border: 1px dashed #ccc; display: flex; justify-content: center; align-items: center; }
        .qr-container img { display: none; }
        .qr-container canvas { display: block !important; margin: 0 auto; width: 120px !important; height: 120px !important; }

        .btn-map-link { background: #1976d2; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; margin-top: 15px; cursor: pointer; font-weight: bold; }

        @media print {
            nav, .btn-principal, .btn-map-link, header, .header-logos { display: none !important; }
            body { padding: 0; background: white; }
            section { display: block !important; }
            .tree-card { break-inside: avoid; page-break-inside: avoid; border: 1px solid #ccc; box-shadow: none; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <!-- 1. INÍCIO -->
    <section id="inicio" class="active-section">
        <div class="header-logos">
            <img src="biologia.jfif.jfif" class="logo-circle" alt="Biologia">
            <img src="ifpa.jfif.jfif" class="logo-circle" alt="IFPA">
        </div>
        <div class="hero">
            <img src="fundo.jpeg.jpeg" class="img-fachada" alt="Fachada IFPA">
            <h1>UTILIZAÇÃO DE QR CODE COMO FERRAMENTA DE GESTÃO NA IDENTIFICAÇÃO DE ESPÉCIES ARBÓREAS DO CAMPUS DO IFPA - ITAITUBA</h1>
            <p style="margin-top: 15px;">Desenvolvido por Rose Magno de Sousa</p>
        </div>
    </section>

    <!-- 2. CADASTRO -->
    <section id="cadastro">
        <h2>🌱 Registrar Árvore</h2>
        <div class="card">
            <label>Nome Popular</label>
            <input type="text" id="nome" placeholder="Ex: Ipê">
            
            <label>Nome Científico</label>
            <input type="text" id="cientifico" placeholder="Ex: Handroanthus chrysanthus">

            <label>Família Botânica</label>
            <input type="text" id="familia" placeholder="Ex: Bignoniaceae">

            <label>Coordenadas (Lat, Long)</label>
            <input type="text" id="coords" placeholder="Ex: -4.22120, -55.99920">

            <label>Descrição e Usos Bibliográficos</label>
            <textarea id="descricao" rows="3" placeholder="Detalhes da planta..."></textarea>

            <label>Puxar Foto do Computador</label>
            <input type="file" id="arquivo" accept="image/*">

            <button class="btn-principal" onclick="salvarArvore()">SALVAR E GERAR QR CODE</button>
        </div>
    </section>

    <!-- 3. PASTA DE DADOS (INVENTÁRIO) -->
    <section id="catalogo">
        <h2>📖 Pasta de Identificação Botânica (14 Espécies)</h2>
        <div id="lista-plantas" class="grid"></div>
    </section>

    <!-- 4. MAPA SATÉLITE -->
    <section id="mapa">
        <h2>📍 Localização Satélite Real</h2>
        <div class="card" style="height: 500px; padding: 0; overflow: hidden;">
            <iframe id="google-maps" src="" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
        </div>
    </section>

    <nav>
        <button class="nav-btn active" onclick="irAba('inicio')">🏠<br>Início</button>
        <button class="nav-btn" onclick="irAba('cadastro')">➕<br>Cadastrar</button>
        <button class="nav-btn" onclick="irAba('catalogo')">📖<br>Pasta</button>
        <button class="nav-btn" onclick="irAba('mapa')">📍<br>Mapa</button>
    </nav>

    <script>
        // MATRIZ COMPLETA COM AS 14 ÁRVORES DO TCC
        const dadosIniciais = [
            { id: 1, nome: "Acácia", cientifico: "Acacia mangium", familia: "Fabaceae", desc: "Árvore de rápido crescimento, amplamente utilizada para recuperação de solos degradados, fixação de nitrogênio e proteção de encostas.", coords: "-1.45560, -48.48510" },
            { id: 2, nome: "Cacau Selvagem", cientifico: "Theobroma speciosum", familia: "Malvaceae", desc: "Espécie nativa do sub-bosque denso. Antecessora silvestre do cacau comercial, possui altíssimo valor para a preservação da biodiversidade genética regional.", coords: "-4.21931, -55.99794" },
            { id: 3, nome: "Cajá", cientifico: "Spondias mombin", familia: "Anacardiaceae", desc: "Espécie frutífera de grande porte com alto potencial agroindustrial (polpas, sucos e geleias), além de alimentar a fauna local.", coords: "-1.45050, -48.46820" },
            { id: 4, nome: "Cajueiro", cientifico: "Anacardium occidentale", familia: "Anacardiaceae", desc: "Frutífera nativa tropical. Apresenta pseudofruto rico em Vitamina C e castanha de elevado valor comercial e nutricional no mercado nacional.", coords: "-4.26750, -55.99330" },
            { id: 5, nome: "Castanheira", cientifico: "Bertholletia excelsa", familia: "Lecythidaceae", desc: "Conhecida como a 'Gigante da Amazônia'. Espécie protegida por lei cuja semente possui extraordinário valor nutricional, comercial e ecológico.", coords: "-4.26776, -55.99316" },
            { id: 6, nome: "Acácia", cientifico: "Acacia mangium", familia: "Fabaceae", desc: "Árvore de rápido crescimento, indicada para recuperação de áreas degradadas e proteção do solo (Ponto de monitoramento secundário).", coords: "-4.23860, -56.00827" },
            { id: 7, nome: "Castanheira", cientifico: "Bertholletia excelsa", familia: "Lecythidaceae", desc: "Espécie protegida por lei. Considerada um gigante da Amazônia, com sementes de alto valor nutritivo e socioeconômico. [Ponto 1 - Beira Rio]", coords: "-4.22150, -55.99881" },
            { id: 8, nome: "Cupuaçu", cientifico: "Theobroma grandiflorum", familia: "Malvaceae", desc: "Frutífera amazônica emblemática, cuja polpa e sementes possuem ampla aplicação culinária e na indústria de cosméticos.", coords: "-4.22100, -55.99892" },
            { id: 9, nome: "Embaúba", cientifico: "Cecropia leucomela", familia: "Urticaceae", desc: "Planta pioneira de crescimento acelerado, fundamental em processos pioneiros de regeneração florestal espontânea.", coords: "-4.22181, -56.00067" },
            { id: 10, nome: "Inajá", cientifico: "Maximiliana maripa", familia: "Arecaceae", desc: "Palmeira nativa de frutos oleaginosos e folhas largamente utilizadas em coberturas e artesanato tradicional.", coords: "-4.22139, -55.99881" },
            { id: 11, nome: "Ipê", cientifico: "Handroanthus chrysanthus", familia: "Bignoniaceae", desc: "Espécie ornamental de madeira densa, com flores de alta expressividade estética e potencial terapêutico. (Área interna do bosque)", coords: "-4.22120, -55.99920" },
            { id: 12, nome: "Mangueira", cientifico: "Mangifera indica", familia: "Anacardiaceae", desc: "Árvore exótica amplamente cultivada na região urbana e institucional pela oferta de sombra e frutos.", coords: "-4.22100, -55.99892" },
            { id: 13, nome: "Mogno Africano", cientifico: "Khaya senegalensis", familia: "Meliaceae", desc: "Árvore introduzida de elevado valor comercial madeireiro, utilizada em modelos de reflorestamento produtivo comercial. (Área de transição)", coords: "-4.22140, -55.99950" },
            { id: 14, nome: "Sumaúma", cientifico: "Ceiba pentandra", familia: "Malvaceae", desc: "Considerada a 'árvore da vida' ou 'rainha da floresta', possui imenso valor cultural e ecológico na Amazônia, atuando na retenção de água do solo.", coords: "-1.45560, -48.48510" }
        ];

        // Carrega dados salvos no navegador ou inicia com os 14 dados padrões da matriz
        let inventario = JSON.parse(localStorage.getItem('tcc_final_rose_14')) || dadosIniciais;

        function irAba(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active-section'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active-section');
            if(id === 'catalogo') atualizarPasta();
            
            const botoes = ['inicio', 'cadastro', 'catalogo', 'mapa'];
            document.querySelectorAll('.nav-btn')[botoes.indexOf(id)].classList.add('active');
        }

        function salvarArvore() {
            const file = document.getElementById('arquivo').files[0];
            const reader = new FileReader();

            const nova = {
                id: Date.now(),
                nome: document.getElementById('nome').value,
                cientifico: document.getElementById('cientifico').value,
                familia: document.getElementById('familia').value,
                coords: document.getElementById('coords').value,
                desc: document.getElementById('descricao').value
            };

            reader.onloadend = function() {
                nova.midia = reader.result || 'fundo.jpeg.jpeg';
                inventario.push(nova);
                localStorage.setItem('tcc_final_rose_14', JSON.stringify(inventario));
                alert("Árvore cadastrada com sucesso!");
                irAba('catalogo');
            }

            if(file) reader.readAsDataURL(file);
            else reader.onloadend();
        }

        function atualizarPasta() {
            const container = document.getElementById('lista-plantas');
            container.innerHTML = "";
            
            inventario.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'tree-card';
                card.innerHTML = `
                    <img src="${p.midia || 'fundo.jpeg.jpeg'}" alt="${p.nome}">
                    <div class="info">
                        <h3>#${index + 1} ${p.nome}</h3>
                        <p class="cientifico">${p.cientifico || ''}</p>
                        <p class="familia"><b>Família:</b> ${p.familia || 'N/A'}</p>
                        <p class="desc"><b>Descrição:</b> ${p.desc}</p>
                        <p style="font-weight:bold; color:var(--verde-if); margin-top:5px;">📍 ${p.coords}</p>
                        
                        <div class="qr-container" id="qr-${p.id}"></div>
                        
                        <button class="btn-map-link" onclick="abrirNoMapa('${p.coords}')">VER NO SATÉLITE</button>
                    </div>
                `;
                container.appendChild(card);
                
                // Limpeza antes da geração do QR Code
                const qrElement = document.getElementById(`qr-${p.id}`);
                qrElement.innerHTML = "";
                
                new QRCode(qrElement, {
                    text: `FICHA BOTÂNICA #${index + 1}\nNome: ${p.nome}\nCientífico: ${p.cientifico}\nCoordenadas: ${p.coords}`,
                    width: 120, 
                    height: 120
                });
            });
        }

        function abrirNoMapa(coords) {
            const frame = document.getElementById('google-maps');
            // Remove espaços e ajusta para exibição correta
            const coordsLimpa = coords.replace(/\s+/g, '');
            frame.src = `https://maps.google.com/maps?q=${coordsLimpa}&t=k&z=19&output=embed`;
            irAba('mapa');
        }

        window.onload = function() {
            // Garante que o banco inicial com as 14 árvores fique salvo no navegador no 1º acesso
            if (!localStorage.getItem('tcc_final_rose_14')) {
                localStorage.setItem('tcc_final_rose_14', JSON.stringify(dadosIniciais));
            }
            atualizarPasta();
        };
    </script>
</body>
</html>
